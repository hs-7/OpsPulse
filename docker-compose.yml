services:
  postgres:
    image: postgres:16-alpine
    container_name: opspulse_postgres
    environment:
      POSTGRES_USER: opspulse
      POSTGRES_PASSWORD: opspulse_password
      POSTGRES_DB: opspulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: opspulse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: opspulse_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opspulse_admin
      MINIO_ROOT_PASSWORD: opspulse_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data: