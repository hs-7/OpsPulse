services:
  postgres:
    image: postgres:16-alpine
    container_name: opspulse_postgres
    environment:
      POSTGRES_USER: opspulse
      POSTGRES_PASSWORD: opspulse_password
      POSTGRES_DB: opspulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspulse -d opspulse_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: opspulse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/src/database/migrate.js"]
    environment: &backend_environment
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://opspulse:opspulse_password@postgres:5432/opspulse_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/src/main.js"]
    environment:
      <<: *backend_environment
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/src/worker.js"]
    environment:
      <<: *backend_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const Redis=require('ioredis');const {Pool}=require('pg');const r=new Redis(process.env.REDIS_URL);const p=new Pool({connectionString:process.env.DATABASE_URL});const k='opspulse:worker:heartbeat:'+process.env.HOSTNAME;Promise.all([r.ping(),r.get(k).then(v=>{if(!v)throw Error('worker heartbeat missing')}),p.query('SELECT 1')]).then(()=>Promise.all([r.quit(),p.end()])).then(()=>process.exit(0)).catch(async()=>{await Promise.allSettled([r.quit(),p.end()]);process.exit(1)})"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
